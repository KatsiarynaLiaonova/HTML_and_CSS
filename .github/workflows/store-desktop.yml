name: Build ALI BABA desktop
on:
  workflow_dispatch:
  push:
    paths:
      - 'store-app/**'
      - '.github/workflows/store-desktop.yml'
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: store-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/ali-baba-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/ali-baba-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check checkout, label PDFs and barcode scanning
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ali-baba-browser/node_modules/playwright"
          export PRINT_TEST_OUTPUT_DIR="$RUNNER_TEMP/ali-baba-print-pdfs"
          export STORE_TEST_URL=http://127.0.0.1:8767
          for scenario in browser printing scanner; do
            check_dir=$(mktemp -d "$RUNNER_TEMP/ali-baba-$scenario.XXXXXX")
            STORE_DATA_DIR="$check_dir/data" python server.py --no-browser --port 8767 >"$check_dir/server.log" 2>&1 &
            service_pid=$!
            trap 'kill "$service_pid" 2>/dev/null || true' EXIT
            python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(100):
              try:
                  with urlopen('http://127.0.0.1:8767/api/state', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise RuntimeError('Isolated test server did not become ready')
          PY
            if node "tests/$scenario.cjs" >"$check_dir/result.log" 2>&1; then
              cat "$check_dir/result.log"
            else
              check_status=$?
              cat "$check_dir/result.log"
              {
                echo "### Browser check: $scenario"
                echo '```text'
                cat "$check_dir/result.log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$check_status"
            fi
            kill "$service_pid"
            wait "$service_pid" || true
            trap - EXIT
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Label-print-PDF-checks
          path: ${{ runner.temp }}/ali-baba-print-pdfs/*.pdf
          if-no-files-found: ignore
  desktop:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: store-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements-desktop.txt pyinstaller==6.16.0
      - name: Accounting and migration tests
        run: python -m unittest discover -s tests -v
      - name: Check native desktop window from source
        timeout-minutes: 3
        run: python desktop.py --desktop-smoke-test
      - name: Build desktop app
        run: python -m PyInstaller packaging/NileStore.spec --noconfirm
      - name: Check Windows app runtime
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process dist/AliBaba/AliBaba.exe -ArgumentList '--desktop-smoke-test' -PassThru
          if (-not $app.WaitForExit(90000)) { $app.Kill(); throw "App window timed out" }
          if ($app.ExitCode -ne 0) { throw "App self-test failed: $($app.ExitCode)" }
      - name: Check macOS app runtime
        timeout-minutes: 3
        if: runner.os == 'macOS'
        run: '"dist/ALI BABA.app/Contents/MacOS/AliBaba" --desktop-smoke-test'
      - name: Check bundled resources
        shell: bash
        run: test -n "$(find dist -name index.html -print -quit)"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows-installer.iss'
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/ALI BABA.app" "dist/AliBaba-${{ runner.arch }}-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: AliBaba-${{ runner.os }}-${{ runner.arch }}
          path: |
            store-app/dist/AliBaba-Setup-Windows.exe
            store-app/dist/AliBaba-*-macOS.zip
          if-no-files-found: error
