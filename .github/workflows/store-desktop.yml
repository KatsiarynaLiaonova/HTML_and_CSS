name: Build Nile Store desktop
on:
  workflow_dispatch:
  push:
    paths:
      - 'store-app/**'
      - '.github/workflows/store-desktop.yml'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: store-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Accounting and migration tests
        run: python -m unittest discover -s tests -v
      - name: Install build tools
        run: python -m pip install pyinstaller==6.16.0
      - name: Build desktop app
        run: python -m PyInstaller packaging/NileStore.spec --noconfirm
      - name: Check Windows app runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process dist/NileStore/NileStore.exe -ArgumentList '--self-test' -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "App self-test failed: $($app.ExitCode)" }
      - name: Check macOS app runtime
        if: runner.os == 'macOS'
        run: '"dist/Nile Store.app/Contents/MacOS/NileStore" --self-test'
      - name: Check bundled resources
        shell: bash
        run: test -n "$(find dist -name index.html -print -quit)"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows-installer.iss'
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Nile Store.app" "dist/NileStore-${{ runner.arch }}-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: NileStore-${{ runner.os }}-${{ runner.arch }}
          path: |
            store-app/dist/NileStore-Setup-Windows.exe
            store-app/dist/NileStore-*-macOS.zip
          if-no-files-found: error
